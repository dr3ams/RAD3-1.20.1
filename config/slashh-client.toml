#Draw slashes at all.
show = true
#Use the old pixel cut instead of the smooth one.
classicCuts = true
#Slash size.
#Range: 0.4 ~ 2.5
size = 1.0
#Slash opacity.
#Range: 0.1 ~ 1.0
opacity = 1.0
#Draw other players' slashes.
others = true
#Colour slashes by the damage type of the hit.
typeColours = true
#Draw combo finishers as an X-cut.
finishers = true
#Draw wide arcs on the extra targets of a sweep.
sweeps = true
#Blood spray on blood hits.
spray = true
#Camera shake on your own crits and finishers. 0 is off.
#Range: 0.0 ~ 2.0
shake = 0.5

